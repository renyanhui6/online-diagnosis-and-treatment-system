spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/onlinetreat?serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.task.scheduling.enabled=false

app.auth.enabled=false
app.auth.dev-token-enabled=true
app.schedule.enabled=false
app.registration.reconcile-enabled=false
app.registration.reservation.enabled=false
app.redis.listener-enabled=false

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
