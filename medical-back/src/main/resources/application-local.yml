server:
  port: 8080
  servlet:
    context-path: /treat

spring:
  config:
    import: optional:classpath:application-local.secret.yml

  # 本地启动使用 MySQL（用于跑完整业务数据与排班/挂号流程）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/onlinetreat?serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  # 本地若没有 Redis：保持配置，但关闭监听，避免启动阶段阻塞
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 20000
      username:
      password:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  auth:
    enabled: false
    dev-user-id: 3
    dev-username: user1
    dev-token-enabled: true
  websocket:
    path: /ws/chat
    patient-response-timeout-minutes: 3
  redis:
    listener-enabled: false
    fallback-enabled: true
  schedule:
    enabled: true
  registration:
    reconcile-enabled: true
    reservation:
      enabled: true

ai:
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:20}
  search:
    enabled: ${AI_SEARCH_ENABLED:false}
    provider: ${AI_SEARCH_PROVIDER:tavily}
    endpoint: ${AI_SEARCH_ENDPOINT:https://api.tavily.com/search}
    api-key: ${AI_SEARCH_API_KEY:}
    max-results: ${AI_SEARCH_MAX_RESULTS:5}
    timeout-seconds: ${AI_SEARCH_TIMEOUT_SECONDS:15}

payment:
  mock:
    return-url: ${PAYMENT_RETURN_URL:http://127.0.0.1:5173/payment/result}
    payment-expire-minutes: ${PAYMENT_EXPIRE_MINUTES:15}
    expire-scan-interval-ms: ${PAYMENT_EXPIRE_SCAN_INTERVAL_MS:60000}

upload:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:medical}
  public-url-prefix: ${MINIO_PUBLIC_URL_PREFIX:http://localhost:9000/medical}
