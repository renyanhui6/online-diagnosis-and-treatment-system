<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
    
    <!-- 旋转动画 -->
    <animateTransform id="rotate1" attributeName="transform" attributeType="XML" type="rotate" from="0 150 150" to="360 150 150" dur="60s" repeatCount="indefinite" />
    <animateTransform id="rotate2" attributeName="transform" attributeType="XML" type="rotate" from="360 150 150" to="0 150 150" dur="30s" repeatCount="indefinite" />
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="150" cy="150" r="140" fill="url(#circleGradient)" />
  
  <!-- 外环 -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 150 150" to="360 150 150" dur="120s" repeatCount="indefinite" />
  </circle>
  
  <!-- 中环 -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="10,5">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 150 150" to="0 150 150" dur="90s" repeatCount="indefinite" />
  </circle>
  
  <!-- 内环 -->
  <circle cx="150" cy="150" r="100" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 150 150" to="360 150 150" dur="60s" repeatCount="indefinite" />
  </circle>
  
  <!-- 刻度线 -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 150 150" to="360 150 150" dur="120s" repeatCount="indefinite" />
    
    <!-- 刻度线 - 每30度一条 -->
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(0 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(30 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(60 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(90 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(120 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(150 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(180 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(210 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(240 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(270 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(300 150 150)" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" transform="rotate(330 150 150)" />
  </g>
  
  <!-- 装饰点 -->
  <circle cx="150" cy="50" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="250" cy="150" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="150" cy="250" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="50" cy="150" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>